spring.application.name=desafio-ativacao
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/ativacao}
spring.datasource.username=${DATABASE_USERNAME:ativacao}
spring.datasource.password=${DATABASE_PASSWORD:ativacao}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.mvc.problemdetails.enabled=true
documentacao.oauth2.token-url=${SWAGGER_OAUTH_TOKEN_URL:http://localhost:8081/default/token}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
spring.servlet.multipart.enabled=false
server.max-http-request-header-size=16KB
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
seguranca.jwt.emissor=${JWT_ISSUER:http://localhost:8081}
seguranca.jwt.audiencia=${JWT_AUDIENCE:desafio-ativacao}

provedor.url-base=${PROVIDER_BASE_URL:http://localhost:8090}
provedor.token=${PROVIDER_TOKEN:}
provedor.timeout-conexao=${PROVIDER_CONNECT_TIMEOUT:2s}
provedor.timeout-leitura=${PROVIDER_READ_TIMEOUT:5s}
processamento.maximo-tentativas=${PROCESSING_MAX_ATTEMPTS:4}
processamento.atraso-base=${PROCESSING_BASE_DELAY:5s}
processamento.intervalo-worker=${PROCESSING_WORKER_INTERVAL:2s}
processamento.timeout-preso=${PROCESSING_STUCK_TIMEOUT:2m}
processamento.tamanho-lote=${PROCESSING_BATCH_SIZE:20}
processamento.worker-habilitado=${PROCESSING_WORKER_ENABLED:true}
observabilidade.metricas-status-intervalo=${STATUS_METRICS_INTERVAL:15s}

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
logging.structured.format.console=logstash
