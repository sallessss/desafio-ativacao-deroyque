services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ativacao
      POSTGRES_USER: ativacao
      POSTGRES_PASSWORD: ativacao
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ativacao -d ativacao"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - dados-postgres:/var/lib/postgresql/data

  provedor:
    image: wiremock/wiremock:3.13.1
    ports:
      - "8090:8080"
    volumes:
      - ./docker/wiremock:/home/wiremock:ro

  oauth-server:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.2
    environment:
      JSON_CONFIG: >-
        {"tokenCallbacks":[{"issuerId":"default","requestMappings":[{"requestParam":"client_id","match":"*","claims":{"sub":"$${clientId}","aud":["desafio-ativacao"],"scope":"$${scope}"}}]}]}
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/isalive"]
      start_period: 5s
      interval: 2s
      timeout: 1s
      retries: 10

  aplicacao:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/ativacao
      DATABASE_USERNAME: ativacao
      DATABASE_PASSWORD: ativacao
      PROVIDER_BASE_URL: http://provedor:8080
      JWT_JWK_SET_URI: http://oauth-server:8080/default/jwks
      JWT_ISSUER: http://localhost:8081/default
      JWT_AUDIENCE: desafio-ativacao
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      provedor:
        condition: service_started
      oauth-server:
        condition: service_healthy

volumes:
  dados-postgres:
