name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Maven e integrações
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Obter código
        uses: actions/checkout@v7

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Permitir execução do Maven Wrapper
        run: chmod +x mvnw

      - name: Executar testes locais e integrados
        run: ./mvnw -B -ntp -Pintegracao verify

      - name: Publicar relatórios de testes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-testes-${{ github.run_id }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 7
