name: Build Docker Compose

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compose-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  construir-e-validar:
    name: Build e smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Obter código
        uses: actions/checkout@v7

      - name: Validar configuração do Compose
        run: docker compose config --quiet

      - name: Construir imagens
        run: docker compose build --pull

      - name: Subir ambiente e aguardar health checks
        run: docker compose up --detach --wait --wait-timeout 180

      - name: Validar readiness da aplicação
        run: curl --fail --silent --show-error --retry 10 --retry-delay 3 http://localhost:8080/actuator/health/readiness

      - name: Validar documentação OpenAPI
        run: |
          openapi=$(curl --fail --silent --show-error http://localhost:8080/v3/api-docs)
          python3 -c '
          import json, sys
          spec = json.load(sys.stdin)
          assert "/api/v1/requests" in spec["paths"]
          assert "/api/v1/requests/{id}" in spec["paths"]
          assert "post" in spec["paths"]["/api/v1/requests"]
          assert "get" in spec["paths"]["/api/v1/requests"]
          assert "get" in spec["paths"]["/api/v1/requests/{id}"]
          assert spec["components"]["securitySchemes"]["oauth2"]["flows"]["clientCredentials"]["tokenUrl"]
          ' <<< "$openapi"
          curl --fail --silent --show-error --location --output /dev/null http://localhost:8080/swagger-ui.html

      - name: Validar autenticação e endpoints protegidos
        run: |
          token_response=$(curl --fail --silent --show-error \
            --request POST http://localhost:8081/default/token \
            --user 'ci-consumer:segredo-local' \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=client_credentials' \
            --data-urlencode 'client_id=ci-consumer' \
            --data-urlencode 'scope=requests.read requests.write')
          access_token=$(python3 -c 'import json, sys; print(json.load(sys.stdin)["access_token"])' <<< "$token_response")

          create_status=$(curl --silent --show-error \
            --output /tmp/created-request.json \
            --write-out '%{http_code}' \
            --request POST http://localhost:8080/api/v1/requests \
            --header "Authorization: Bearer $access_token" \
            --header 'Content-Type: application/json' \
            --data '{"externalId":"CI-${{ github.run_id }}-${{ github.run_attempt }}","customerId":"CUST-CI","productCode":"PROD-CI"}')
          test "$create_status" = '201'

          curl --fail --silent --show-error \
            --header "Authorization: Bearer $access_token" \
            'http://localhost:8080/api/v1/requests?page=0&size=1'

      - name: Validar mock do provedor
        run: |
          curl --fail --silent --show-error \
            --request POST http://localhost:8090/provider/v1/activate \
            --header 'Content-Type: application/json' \
            --header 'Idempotency-Key: CI-SMOKE-1' \
            --header 'X-Correlation-ID: ci-smoke-1' \
            --data '{"externalId":"CI-SMOKE-1","customerId":"CUST-1","productCode":"PROD-1"}'

      - name: Exibir diagnóstico em caso de falha
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Remover ambiente
        if: always()
        run: docker compose down --volumes --remove-orphans
